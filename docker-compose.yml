# Menjalankan database, API, dan web untuk development / server kecil.
#   docker compose up -d --build
#   docker compose exec api seed -demo
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pest
      POSTGRES_PASSWORD: pest
      POSTGRES_DB: pestcontrol
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pest"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://pest:pest@db:5432/pestcontrol?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-ganti-dengan-rahasia-panjang}
      CORS_ORIGINS: http://localhost:5173,http://localhost:8081
    volumes: [files:/data]
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./web
    ports: ["8081:80"]
    depends_on: [api]

volumes:
  dbdata:
  files:
