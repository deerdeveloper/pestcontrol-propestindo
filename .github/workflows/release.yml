name: Release
# Dijalankan MANUAL (Actions -> Release -> Run workflow) supaya membuat tag/release dari komputer tidak ikut memicu build
# yang memakai kuota menit. Isi "tag" (mis. v0.2.0); release dibuat bila belum ada. Rilis harian dari komputer: make publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag rilis, format vX.Y.Z (mis. v0.2.0)"
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag }}
jobs:
  # Hasil build diunggah langsung ke GitHub Release (bukan Actions artifact), jadi tidak memakai kuota
  # penyimpanan artifact. Release dibuat sebagai draft dulu dan baru diterbitkan di job terakhir.
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - id: v
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag harus berformat vX.Y.Z (diisi: $RELEASE_TAG)"; exit 1; }
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          # Kode versi Android harus selalu naik; nomor build dimulai dari 10000 (sama dengan tool/build.sh).
          echo "build=$((GITHUB_RUN_NUMBER + 10000))" >> "$GITHUB_OUTPUT"
      - name: Buat draft release (dilewati bila sudah ada, mis. re-run)
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "$RELEASE_TAG" --generate-notes

  backend:
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web + linux arm64 (Orange Pi 4 Pro) + amd64
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          GITHUB_REPO: ${{ github.repository }}
        run: tool/build.sh backend
      - name: Unggah ke release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber

  android:
    runs-on: ubuntu-latest
    needs: meta
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      # JDK 21: lint Android Gradle Plugin memakai API Java 21 (List.removeLast); dengan JDK 17 build crash
      # di lintVitalAnalyzeRelease (image_picker_android).
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Cache pub (paket Dart)
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE || '~/.pub-cache' }}
          key: pub-${{ runner.os }}-${{ hashFiles('mobile/pubspec.yaml') }}
          restore-keys: pub-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/gdist
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Unduh Gradle (cache + coba ulang + cadangan)
        working-directory: mobile/android
        run: |
          # Gradle wrapper mengunduh dari github.com; bila GitHub sedang 5xx build gagal. Unduh sendiri dengan retry,
          # lalu arahkan wrapper ke berkas lokal. Berkas disimpan di cache supaya run berikutnya tidak mengunduh lagi.
          PROP=gradle/wrapper/gradle-wrapper.properties
          URL=$(sed -n 's/^distributionUrl=//p' "$PROP" | sed 's#\\:#:#g')
          FILE=$(basename "$URL")
          mkdir -p "$HOME/gdist"
          DEST="$HOME/gdist/$FILE"
          if [ ! -s "$DEST" ]; then
            VER=${FILE#gradle-}; VER=${VER%-*.zip}
            ok=0
            for u in "$URL" "https://services.gradle.org/distributions/$FILE" "https://mirrors.cloud.tencent.com/gradle/$FILE"; do
              echo "Mengunduh $u"
              if curl -fL --retry 6 --retry-all-errors --retry-delay 15 --connect-timeout 30 -o "$DEST.part" "$u" && unzip -tq "$DEST.part" >/dev/null; then
                mv "$DEST.part" "$DEST"; ok=1; break
              fi
              rm -f "$DEST.part"
            done
            [ "$ok" = 1 ] || { echo "::error::Gagal mengunduh Gradle $VER dari semua sumber"; exit 1; }
          fi
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\\\:$DEST#" "$PROP"
          grep '^distributionUrl' "$PROP"
      - name: Keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Require keystore
        if: env.HAS_KEYSTORE != 'true' && vars.ALLOW_UNSIGNED_ANDROID != 'true'
        run: |
          echo "::error::Secret ANDROID_KEYSTORE_BASE64 belum diisi (atau set variable ALLOW_UNSIGNED_ANDROID=true untuk rilis bertanda-tangan debug)."
          exit 1
      - name: Build APK + AAB
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          BUILD: ${{ needs.meta.outputs.build }}
          API_URL: ${{ vars.API_URL }}
          ANDROID_KEYSTORE_FILE: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${API_URL:?Set repository variable API_URL (mis. https://laporan.domain.com)}"
          tool/build.sh android
      - name: Unggah ke release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/*.apk dist/*.aab --clobber

  # Setelah semua build terunggah: buat SHA256SUMS dari isi release, lalu terbitkan (draft -> publik).
  release:
    runs-on: ubuntu-latest
    needs: [backend, android]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checksums
        run: |
          mkdir dist && cd dist
          gh release download "$RELEASE_TAG" --pattern '*' --clobber
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
      - name: Terbitkan
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
